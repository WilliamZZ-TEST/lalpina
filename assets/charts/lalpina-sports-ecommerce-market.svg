<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <title id="title">Four-platform sports e-commerce market and baseline scenario</title>
  <desc id="desc">Four-platform sports-goods e-commerce market from 2024 to 2027 in 100 million yuan. 2024 and 2025 are actual or derived actual values; 2026 and 2027 are a 10 percent baseline scenario.</desc>
  <rect width="720" height="410" fill="#ffffff"/>
  <g stroke="#d9ddd3" stroke-width="1"><path d="M76 304.5H682M76 221.5H682M76 138.5H682M76 55.5H682"/></g>
  <g fill="#59655b" font-family="Arial, sans-serif" font-size="12"><text x="64" y="308" text-anchor="end">0</text><text x="64" y="225" text-anchor="end">2,000</text><text x="64" y="142" text-anchor="end">4,000</text><text x="64" y="59" text-anchor="end">6,000</text><text x="76" y="28">Unit: CNY 100m</text></g>
  <path d="M76 305H682" stroke="#60715b" stroke-width="1"/>
  <g fill="#1f3a2c"><rect x="122" y="144.1" width="92" height="160.9"/><rect x="270" y="118.5" width="92" height="186.5"/></g>
  <g fill="#b59b78"><rect x="418" y="99.9" width="92" height="205.1"/><rect x="566" y="79.3" width="92" height="225.7"/></g>
  <g fill="#101712" font-family="Arial, sans-serif" font-size="13" font-weight="700"><text x="168" y="134" text-anchor="middle">3,876.3</text><text x="316" y="108" text-anchor="middle">4,493.9</text><text x="464" y="89" text-anchor="middle">4,943.3</text><text x="612" y="69" text-anchor="middle">5,437.7</text></g>
  <g fill="#101712" font-family="Arial, sans-serif" font-size="13"><text x="168" y="332" text-anchor="middle">2024</text><text x="316" y="332" text-anchor="middle">2025</text><text x="464" y="332" text-anchor="middle">2026</text><text x="612" y="332" text-anchor="middle">2027</text></g>
  <g font-family="Arial, sans-serif" font-size="11"><rect x="76" y="366" width="12" height="12" fill="#1f3a2c"/><text x="96" y="376" fill="#59655b">Actual / derived actual</text><rect x="270" y="366" width="12" height="12" fill="#b59b78"/><text x="290" y="376" fill="#59655b">Baseline scenario: 10% annual growth</text></g>
